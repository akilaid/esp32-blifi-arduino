; Blifi — BLE Wi-Fi provisioning for ESP32, Arduino-style, via PlatformIO.
;
; Uses the pioarduino platform (arduino-esp32 3.x on ESP-IDF 5.5) with
; `framework = arduino, espidf` so the NimBLE-based blifi component builds from
; source. Open this folder in VS Code + PlatformIO and click Upload.
[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino, espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
